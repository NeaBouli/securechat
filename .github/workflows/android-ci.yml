name: SecureChat Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: securechat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create ephemeral CI signing identity
        shell: bash
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/securechat-ci-only.jks"
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias securechat-ci \
            -keyalg RSA -keysize 3072 -validity 2 \
            -dname "CN=CI Verification Only"
          printf 'KEYSTORE_PATH=%s\nKEYSTORE_PASS=%s\nKEY_ALIAS=%s\n' \
            "$keystore" "$password" "securechat-ci" > local.properties

      - name: Verify and build debug and release artifacts
        run: >-
          ./gradlew --no-daemon --max-workers=2
          check
          lintRelease
          assembleDebug
          assembleRelease
          bundleRelease

      - name: Validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"
          unzip -tq "$apk"
          unzip -tq "$aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify "$apk"
          jarsigner -verify "$aab"
          entries="$(unzip -Z1 "$aab")"
          grep -Eq '^META-INF/[^/]+\.SF$' <<< "$entries"
          grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$' <<< "$entries"

      - name: Remove ephemeral signing material
        if: always()
        run: rm -f local.properties "${RUNNER_TEMP}/securechat-ci-only.jks"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securechat-test-results
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: warn

      - name: Upload CI-only release verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securechat-ci-only-release-verification
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
