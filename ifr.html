<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureChat IFR Discount</title>
<style>
:root{color-scheme:dark;--accent:#00ff88;--brand:#00d4ff;--bg:#070910;--panel:#10141d;--text:#eef3f8;--muted:#a8b0bc}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:min(580px,100%);box-sizing:border-box;border:1px solid rgba(0,212,255,.25);border-radius:12px;background:var(--panel);padding:22px}
h1{margin:0 0 8px;color:var(--brand);font-size:clamp(28px,7vw,42px);line-height:1.05}
.muted{color:var(--muted);line-height:1.5}
.btn{display:block;width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#03140a;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.65;cursor:wait}
.line{background:transparent;color:var(--brand);border-color:var(--brand)}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.wallets .btn{margin:0}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.28);background:#f8fafc;color:#07111f;margin:8px 0 10px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input::placeholder{color:#64748b;font-weight:500}
#status{font-size:14px;color:#d8e2ee;min-height:20px;line-height:1.45}
@media(max-width:520px){.wallets{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<h1>SecureChat IFR Discount</h1>
<p class="muted">Browser wallet verification and discounted checkout are planned but currently disabled pending VLABS payment, accounting and launch approval.</p>
<button id="connect" class="btn" type="button" disabled>Wallet verification planned</button>
<button id="disconnect" class="btn line" type="button" disabled>Unavailable</button>
<div class="wallets">
  <button id="metamask" class="btn line" type="button" disabled>MetaMask unavailable</button>
  <button id="phantom" class="btn line" type="button" disabled>Phantom unavailable</button>
</div>
<input id="wallet" readonly placeholder="Connected wallet address">
<button class="btn" type="button" disabled>Pro discount planned</button>
<button class="btn" type="button" disabled>Elite discount planned</button>
<button class="btn line" type="button" disabled>Suite discount planned</button>
<p id="status">Current price and availability are controlled by VLABS.</p>
</main>
<script>
(function(){
var API='https://api.stealthx.tech';
var WC_PROJECT_ID='32f56abaa4b1d7f59fb1571c0c0a551f';
var WC_ESM_URL='https://esm.sh/@walletconnect/ethereum-provider@2.17.3';
var RPC_URL='https://eth.llamarpc.com';
var connectedProvider=null;
var connectedAddress='';
function status(msg){document.getElementById('status').textContent=msg}
function short(addr){return addr.slice(0,6)+'...'+addr.slice(-4)}
function balanceText(value){return value?(' Balance: '+value+' IFR.'):""}
function checkoutError(data){
  var error=(data&&data.error)||'Checkout unavailable';
  if(error==='ifr_not_eligible')return 'No eligible IFR balance found for this wallet.'+balanceText(data.balanceAmount);
  if(error==='ifr_tier_too_low')return 'IFR balance found, but tier is too low. Required: '+(data.requiredTier||'higher tier')+'. Current: '+(data.walletTier||'none')+'.'+balanceText(data.balanceAmount);
  if(error==='wallet_signature_required')return 'Wallet signature is required before IFR discount checkout can open.';
  if(error==='wallet_signature_invalid')return 'Wallet signature could not be verified. Please reconnect and sign again.';
  if(error==='wallet_challenge_expired')return 'Wallet verification expired. Please tap checkout again and sign the new request.';
  if(error==='invalid_wallet_challenge'||error==='wallet_challenge_mismatch')return 'Wallet verification mismatch. Please reconnect the wallet and try again.';
  if(error==='rate_limited')return 'Too many checkout attempts. Please wait a few minutes and try again.';
  return error;
}
function dappPath(){return location.host+location.pathname}
function openMetaMask(){location.href='https://link.metamask.io/dapp/'+dappPath()}
function openPhantom(){location.href='https://phantom.app/ul/browse/'+encodeURIComponent(location.href)+'?ref='+encodeURIComponent(location.origin)}
function injectedProviders(){
  var list=[];
  if(window.ethereum&&Array.isArray(window.ethereum.providers))list=list.concat(window.ethereum.providers);
  if(window.ethereum)list.push(window.ethereum);
  if(window.phantom&&window.phantom.ethereum)list.push(window.phantom.ethereum);
  return list.filter(function(p,i,a){return p&&p.request&&a.indexOf(p)===i})
}
function namedProvider(){
  var providers=injectedProviders();
  if(!providers.length)return null;
  return providers.find(function(p){return p.isMetaMask})||
    providers.find(function(p){return p.isPhantom})||
    providers.find(function(p){return p.isCoinbaseWallet})||
    providers[0];
}
async function switchMainnet(provider){
  try{await provider.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x1'}]})}catch(e){}
}
async function connectInjected(){
  var provider=namedProvider();
  if(!provider)return null;
  status('Connecting browser wallet...');
  var accounts=await provider.request({method:'eth_requestAccounts'});
  if(!accounts||!accounts[0])throw new Error('No wallet account returned.');
  await switchMainnet(provider);
  connectedProvider=provider;
  connectedAddress=accounts[0];
  document.getElementById('wallet').value=connectedAddress;
  status('Wallet connected: '+short(connectedAddress)+'. Choose checkout to check IFR eligibility.');
  return connectedAddress;
}
async function connectWalletConnect(){
  status('Opening WalletConnect...');
  var mod=await import(WC_ESM_URL);
  var EthereumProvider=mod.EthereumProvider||mod.default;
  if(!EthereumProvider)throw new Error('WalletConnect provider unavailable.');
  var provider=await EthereumProvider.init({
    projectId:WC_PROJECT_ID,
    optionalChains:[1],
    showQrModal:true,
    rpcMap:{1:RPC_URL},
    methods:['eth_requestAccounts','personal_sign','wallet_switchEthereumChain'],
    events:['accountsChanged','chainChanged','disconnect'],
    metadata:{name:'SecureChat IFR Discount',description:'Read-only IFR holder discount verification for SecureChat checkout.',url:location.origin,icons:[location.origin+'/favicon.ico']},
    qrModalOptions:{themeMode:'dark'}
  });
  var accounts=await provider.enable();
  if(!accounts||!accounts[0])throw new Error('No wallet account returned.');
  await switchMainnet(provider);
  connectedProvider=provider;
  connectedAddress=accounts[0];
  document.getElementById('wallet').value=connectedAddress;
  status('Wallet connected: '+short(connectedAddress)+'. Choose checkout to check IFR eligibility.');
  return connectedAddress;
}
async function connect(){
  if(connectedProvider&&connectedAddress)return connectedAddress;
  var address;
  try{address=await connectInjected()}catch(e){
    if(e&&e.code===4001)throw e;
    console.warn('Injected wallet connect failed, falling back to WalletConnect',e);
  }
  if(address)return address;
  return await connectWalletConnect();
}
async function signMessage(message,address){
  if(!connectedProvider)throw new Error('Wallet is not connected.');
  try{return await connectedProvider.request({method:'personal_sign',params:[message,address]})}
  catch(e){return await connectedProvider.request({method:'personal_sign',params:[address,message]})}
}
async function disconnect(){
  var provider=connectedProvider;
  connectedProvider=null;
  connectedAddress='';
  document.getElementById('wallet').value='';
  try{if(provider&&provider.disconnect)await provider.disconnect()}catch(e){}
  status('Wallet disconnected. Connect a wallet to verify IFR discount eligibility.');
}
async function checkout(tier,btn){
  btn.disabled=true;
  status('Paid activation and IFR discounts are launch-gated. Check VLABS for availability.');
}
document.getElementById('connect').onclick=function(){connect().catch(function(e){status(e&&e.message?e.message:'Wallet connection failed.')})};
document.getElementById('disconnect').onclick=function(){disconnect()};
document.getElementById('metamask').onclick=openMetaMask;
document.getElementById('phantom').onclick=openPhantom;
document.querySelectorAll('[data-tier]').forEach(function(b){b.onclick=function(){checkout(b.dataset.tier,b)}});
})();
</script>
</body>
</html>
