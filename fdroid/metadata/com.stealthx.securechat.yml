AutoName: SecureChat
Summary: End-to-end encrypted Android messaging without a phone number.
Description: |-
  SecureChat is an end-to-end encrypted Android messaging app.
  No phone number or account is required. The current alpha uses a
  central signaling relay that processes connection and routing metadata.

  Part of the StealthX Platform. Same unified sx_ID works in
  SecureCall, SecureChat, and Chameleon.

  Features:
  * End-to-end encrypted messaging (XChaCha20-Poly1305)
  * X25519 key exchange, Double Ratchet forward secrecy
  * Safety numbers for manual verification
  * QR code + NFC contact exchange
  * Central signaling relay; Tor and decentralized relays are roadmap work
  * Source available under the repository license
  * Part of StealthX Platform

  Alpha status — not yet ready for production use.

